<script>
  function createParticles() { const container = document.createElement('div'); container.className = 'particles-bg'; for(let i=0;i<30;i++) { const particle = document.createElement('div'); particle.className = 'particle'; const size = Math.random()*4+2; particle.style.width = size+'px'; particle.style.height = size+'px'; particle.style.left = Math.random()*100+'%'; particle.style.animationDelay = Math.random()*15+'s'; particle.style.animationDuration = 12+Math.random()*10+'s'; particle.style.background = `radial-gradient(circle, ${Math.random()>0.7?'#ff2d55':'#00e5ff'}, transparent)`; container.appendChild(particle); } document.body.appendChild(container); }
  let toastElement = null;
  function showToast(message, isError = false) { if (!toastElement) { toastElement = document.createElement('div'); toastElement.className = 'toast-notification'; toastElement.innerHTML = '<i class="fas fa-check-circle"></i><span></span>'; document.body.appendChild(toastElement); } const icon = toastElement.querySelector('i'); const span = toastElement.querySelector('span'); if (isError) { icon.className = 'fas fa-exclamation-triangle'; icon.style.color = '#ff2d55'; } else { icon.className = 'fas fa-check-circle'; icon.style.color = '#00ffaa'; } span.textContent = message; toastElement.classList.add('show'); setTimeout(() => { toastElement.classList.remove('show'); }, 2000); }
  async function copyUPIID(upiId) { try { await navigator.clipboard.writeText(upiId); showToast('✓ UPI ID Copied Successfully', false); } catch(err) { const textarea = document.createElement('textarea'); textarea.value = upiId; document.body.appendChild(textarea); textarea.select(); document.execCommand('copy'); document.body.removeChild(textarea); showToast('✓ UPI ID Copied Successfully', false); } }
  let isLoggedIn = false, showWelcome = false, mainAppVisible = false, currentView = 'home', selectedPackage = null, multiStepState = null;
  const VALID_EMAIL = "crystalqw12@gmail.com", VALID_PASSWORD = "White@x12", UPI_ID = "vishalxastro@fam", PAYEE_NAME = "WHITE X";
  const visaExpiry = ["06/28","09/29","11/30","03/31","12/32","07/33","02/34"];
  const mastercardExpiry = ["05/29","08/30","11/31","07/32","12/33","04/34","09/35"];
  const rupayExpiry = ["08/30","11/31","02/33","03/34","09/35","06/36","12/37"];
  const packagesData = { VISA: [ { price: 450, limitUSD: 150, bestSeller: false, expiryIdx: 0 }, { price: 650, limitUSD: 300, bestSeller: false, expiryIdx: 1 }, { price: 1000, limitUSD: 450, bestSeller: false, expiryIdx: 2 }, { price: 1350, limitUSD: 600, bestSeller: false, expiryIdx: 3 }, { price: 1840, limitUSD: 900, bestSeller: true, expiryIdx: 4 }, { price: 2750, limitUSD: 1250, bestSeller: false, expiryIdx: 5 }, { price: 5000, limitUSD: 2300, bestSeller: false, expiryIdx: 6 } ], Mastercard: [ { price: 650, limitUSD: 200, bestSeller: false, expiryIdx: 0 }, { price: 850, limitUSD: 300, bestSeller: false, expiryIdx: 1 }, { price: 1100, limitUSD: 450, bestSeller: false, expiryIdx: 2 }, { price: 1500, limitUSD: 650, bestSeller: false, expiryIdx: 3 }, { price: 1910, limitUSD: 1000, bestSeller: true, expiryIdx: 4 }, { price: 3000, limitUSD: 1450, bestSeller: false, expiryIdx: 5 }, { price: 5500, limitUSD: 2700, bestSeller: false, expiryIdx: 6 } ], RuPay: [ { price: 850, limitUSD: 200, bestSeller: false, expiryIdx: 0 }, { price: 1100, limitUSD: 300, bestSeller: false, expiryIdx: 1 }, { price: 1500, limitUSD: 450, bestSeller: false, expiryIdx: 2 }, { price: 2000, limitUSD: 700, bestSeller: false, expiryIdx: 3 }, { price: 1990, limitUSD: 1050, bestSeller: true, expiryIdx: 4 }, { price: 3500, limitUSD: 1450, bestSeller: false, expiryIdx: 5 }, { price: 6000, limitUSD: 2800, bestSeller: false, expiryIdx: 6 } ] };
  let activeNetwork = "VISA";
  function getExpiry(network, idx) { if(network === 'VISA') return visaExpiry[idx % visaExpiry.length]; if(network === 'Mastercard') return mastercardExpiry[idx % mastercardExpiry.length]; return rupayExpiry[idx % rupayExpiry.length]; }
  function getNetworkIcon(network) { if(network === 'VISA') return '<i class="fab fa-cc-visa" style="color:#00e5ff;"></i>'; if(network === 'Mastercard') return '<i class="fab fa-cc-mastercard" style="color:#bf4aff;"></i>'; return '<i class="fas fa-rupee-sign" style="color:#ffaa33;"></i>'; }
  function showLoading(cb) { let ov = document.querySelector('.loading-overlay'); if(!ov) { ov = document.createElement('div'); ov.className = 'loading-overlay'; ov.innerHTML = `<div class="loading-card"><div class="spinner-neon"></div><div class="loading-text">Unlocking Vault</div><div class="loading-sub">Secure gateway preparing...</div></div>`; document.body.appendChild(ov); } ov.classList.add('active'); setTimeout(() => { if(cb) cb(); setTimeout(() => ov.classList.remove('active'), 450); }, 1600); }
  function render() { const root = document.getElementById('appRoot'); if(!isLoggedIn) { root.innerHTML = renderLogin(); attachLoginEvents(); } else if(showWelcome) { root.innerHTML = `<div style="display:flex;justify-content:center;align-items:center;min-height:100vh"><div class="glass-card" style="padding:2.5rem;text-align:center"><div style="font-size:4rem;color:#ff2d55"><i class="fas fa-gem"></i></div><div class="neon-logo">WHITE X</div><h2 style="margin:1rem 0">Vault Access Granted</h2><p>Redirecting to secure vault...</p></div></div>`; setTimeout(()=>{ showWelcome=false; mainAppVisible=true; currentView='home'; render(); createParticles(); },2000); } else if(mainAppVisible) { root.innerHTML = renderMain(); attachMainEvents(); } }
  function renderLogin() { return `<div class="login-container"><div class="login-card"><div class="login-header"><div class="security-badge"><i class="fas fa-database"></i> CARD VAULT GATEWAY</div><div class="neon-logo">WHITE X</div><p class="login-subtitle">Secure access to premium card vault</p></div><form id="loginForm"><div class="input-group"><label class="input-label"><i class="fas fa-envelope"></i> Email</label><input type="email" id="loginEmail" class="input-field" placeholder="crystalqw12@gmail.com" value="" required></div><div class="input-group"><label class="input-label"><i class="fas fa-key"></i> Password</label><div class="password-wrapper"><input type="password" id="loginPassword" class="input-field" placeholder="Enter vault key" required><i class="far fa-eye toggle-password" data-target="loginPassword"></i></div></div><div class="login-options"><label class="checkbox-label"><input type="checkbox" id="rememberMe"> <span>Remember device</span></label><a href="#" class="forgot-link" id="forgotLink">Forgot vault key?</a></div><div id="loginError" class="error-msg"></div><button type="submit" class="btn-login"><i class="fas fa-unlock-alt"></i> Unlock Vault</button></form><div class="security-notice"><i class="fas fa-shield-virus"></i> Military-grade encryption • Biometric ready</div><div class="small-legal"><i class="fas fa-fingerprint"></i> 2FA protected • Session timeout</div><div class="login-footer"><span><i class="far fa-copyright"></i> 2026 WHITE X</span><span><i class="fas fa-database"></i> Card Vault</span><span><i class="fas fa-lock"></i> Encrypted</span></div></div></div>`; }
  function attachLoginEvents() { const f = document.getElementById('loginForm'); if(f) f.addEventListener('submit', (e)=>{ e.preventDefault(); const email = document.getElementById('loginEmail')?.value.trim(); const password = document.getElementById('loginPassword')?.value; const errorDiv = document.getElementById('loginError'); if(email === VALID_EMAIL && password === VALID_PASSWORD) { isLoggedIn = true; showWelcome = true; mainAppVisible = false; render(); } else { errorDiv.innerHTML = '<i class="fas fa-exclamation-triangle"></i> Invalid email or password. Please try again.'; const card = document.querySelector('.login-card'); card.style.animation = 'shake 0.4s ease-in-out'; setTimeout(() => { card.style.animation = ''; }, 400); } }); const style = document.createElement('style'); style.textContent = `@keyframes shake { 0%,100% { transform: translateX(0); } 25% { transform: translateX(-8px); } 75% { transform: translateX(8px); } }`; document.head.appendChild(style); document.querySelectorAll('.toggle-password').forEach(i=>i.addEventListener('click',function(){ let t=this.getAttribute('data-target'), inp=document.getElementById(t); if(inp){ inp.type=inp.type==='password'?'text':'password'; this.classList.toggle('fa-eye'); this.classList.toggle('fa-eye-slash'); } })); const fl=document.getElementById('forgotLink'); if(fl) fl.addEventListener('click',(e)=>{ e.preventDefault(); alert('Contact vault administrator to reset your credentials.'); }); }
  function renderMain() { let content = ''; if(currentView==='home') content = renderHome(); else if(currentView==='packages') content = renderPackages(); else if(currentView==='qr_payment') content = renderQRPayment(); else if(currentView==='utr') content = renderUTRPage(); else if(currentView==='failed') content = renderFailedPage(); else if(currentView==='success') content = renderSuccessPage(); const showNav = (currentView==='home' || currentView==='packages'); return `${showNav?`<nav class="navbar"><div class="neon-logo">WHITE X</div><div class="nav-links"><a class="nav-home">Vault Home</a><a class="nav-packages">Card Vault</a><a class="nav-support">Support</a><button id="telegramNavBtn" class="btn-outline" style="padding:0.4rem 1.2rem"><i class="fab fa-telegram"></i> Telegram</button><button id="logoutMainBtn" class="btn-outline" style="padding:0.4rem 1.2rem"><i class="fas fa-sign-out-alt"></i> Lock Vault</button></div></nav>`:''}<main>${content}</main>${(showNav)?`<section class="support-section"><div class="section-title">Vault Support 24/7</div><div class="support-grid"><div class="support-card" id="telegramSupportCard"><i class="fab fa-telegram"></i><h3>Telegram Support</h3><p>@WHITEXOFFICIAL7</p></div><div class="support-card" id="telegramGroupCard"><i class="fas fa-users"></i><h3>Community</h3><p>Join group →</p></div><div class="support-card" id="emailSupportCard"><i class="fas fa-envelope"></i><h3>Email</h3><p>vault@whitex.com</p></div></div></section><footer><div class="neon-logo" style="font-size:1.5rem">WHITE X</div><p>© 2025 — Card Vault Gateway. All rights reserved.</p></footer>`:''}`; }
  function renderHome() { return `<section class="hero"><div class="hero-left"><div class="badge"><i class="fas fa-gem"></i> PREMIUM CARD VAULT</div><div class="neon-logo" style="font-size:3rem; margin:1rem 0">WHITE X</div><h1>Your elite card vault gateway</h1><p style="margin:1rem 0; color:#b0c4de">Instant access to high-limit VISA, Mastercard & RuPay cards with military-grade security.</p><button class="btn-primary explore-packages-btn"><i class="fas fa-gem"></i> Explore Vault</button><div class="feature-row"><div class="feature-chip"><i class="fas fa-lock"></i> Bank-Level Security</div><div class="feature-chip"><i class="fas fa-bolt"></i> Instant Delivery</div><div class="feature-chip"><i class="fas fa-credit-card"></i> Premium Cards</div></div></div><div class="hero-right"><div class="premium-card-stack"><div class="premium-card card-visa-front"><div class="card-header"><div class="card-chip"></div><i class="fab fa-cc-visa" style="color:#0ff; font-size:1.4rem"></i></div><div class="card-body"><div class="card-brand">VAULT ELITE</div><div class="card-title">WHITE X</div><div class="member-badge">✦ Secure Vault ✦</div></div><div class="card-footer"><span>VISA Infinite</span><span>CONTACTLESS</span></div></div><div class="premium-card card-master-mid"><div class="card-header"><div class="card-chip"></div><i class="fab fa-cc-mastercard" style="color:#bf4aff; font-size:1.4rem"></i></div><div class="card-body"><div class="card-brand">WORLD ELITE</div><div class="card-title">MASTERCARD</div><div class="member-badge">✦ Global Access ✦</div></div><div class="card-footer"><span>Mastercard</span><span>PRIORITY PASS</span></div></div><div class="premium-card card-rupay-back"><div class="card-header"><div class="card-chip"></div><i class="fas fa-rupee-sign" style="color:#ff2d55; font-size:1.4rem"></i></div><div class="card-body"><div class="card-brand">DOMINANT</div><div class="card-title">RuPay</div><div class="member-badge">✦ India First ✦</div></div><div class="card-footer"><span>RuPay Select</span><span>REWARDS+</span></div></div></div></div></section>`; }
  function renderPackages() { const pkgs = packagesData[activeNetwork]; return `<section class="packages-section"><div class="section-title">Select Card Type</div><div class="tabs"><button class="tab-btn ${activeNetwork==='VISA'?'active':''}" data-network="VISA">VISA</button><button class="tab-btn ${activeNetwork==='Mastercard'?'active':''}" data-network="Mastercard">Mastercard</button><button class="tab-btn ${activeNetwork==='RuPay'?'active':''}" data-network="RuPay">RuPay</button></div><div class="cards-grid">${pkgs.map((p, idx) => { const expiry = getExpiry(activeNetwork, idx); const networkIcon = getNetworkIcon(activeNetwork); const isBest = p.bestSeller; return `<div class="package-card ${isBest ? 'best-seller-glow' : ''}" style="position: relative;">${isBest ? '<div class="badge-best-seller"><i class="fas fa-star"></i> BEST SELLER</div>' : ''}<div class="card-badges"><span class="badge-refund"><i class="fas fa-undo-alt"></i> Refundable</span><span class="badge-stock"><i class="fas fa-check-circle"></i> InStock</span></div><div class="card-network">${networkIcon}<span class="network-name">${activeNetwork}</span></div><div class="card-subtitle">1 Card</div><div class="info-row"><div class="info-box"><div class="info-label">LIMIT</div><div class="info-value">$${p.limitUSD.toLocaleString()}</div></div><div class="info-box"><div class="info-label">EXPIRY</div><div class="info-value">${expiry}</div></div></div><div class="price-section"><div class="card-price">₹${p.price.toLocaleString()}</div><button class="card-btn buy-now-btn" data-price="${p.price}" data-network="${activeNetwork}" data-expiry="${expiry}">Access Vault <i class="fas fa-arrow-right"></i></button></div></div>`; }).join('')}</div></section>`; }
  function genQR(canvas, amt) { const upiUrl = `upi://pay?pa=${UPI_ID}&pn=${encodeURIComponent(PAYEE_NAME)}&am=${amt}&cu=INR`; const qr = qrcode(0, 'M'); qr.addData(upiUrl); qr.make(); const cs=4, m=4, sz=qr.getModuleCount()*cs+m*2; canvas.width=sz; canvas.height=sz; const ctx=canvas.getContext('2d'); ctx.fillStyle='#FFF'; ctx.fillRect(0,0,sz,sz); ctx.fillStyle='#000'; for(let r=0;r<qr.getModuleCount();r++) for(let c=0;c<qr.getModuleCount();c++) if(qr.isDark(r,c)) ctx.fillRect(c*cs+m, r*cs+m, cs, cs); canvas.style.width='220px'; canvas.style.height='220px'; return upiUrl; }
  function handleHighValuePayment(packagePrice, network, expiry) { if(packagePrice === 2750) { multiStepState = { totalSteps: 2, currentStep: 1, remainingAmount: 750, originalPrice: 2750, network, expiry, paidSoFar: 2000, holderName: "VAULT HOLDER", cardNumber: "**** **** **** 0000" }; currentView = 'qr_payment'; render(); } else if(packagePrice === 5000) { multiStepState = { totalSteps: 3, currentStep: 1, remainingAmount: 3000, originalPrice: 5000, network, expiry, paidSoFar: 2000, holderName: "VAULT HOLDER", cardNumber: "**** **** **** 0000" }; currentView = 'qr_payment'; render(); } else { selectedPackage = { price: packagePrice, network, expiry, holderName: "VAULT HOLDER", cardNumber: "**** **** **** 0000" }; multiStepState = null; currentView = 'qr_payment'; render(); } }
  function getCurrentPaymentAmount() { if(multiStepState) { if(multiStepState.totalSteps === 2 && multiStepState.currentStep === 1) return 2000; if(multiStepState.totalSteps === 3 && multiStepState.currentStep === 1) return 2000; if(multiStepState.totalSteps === 3 && multiStepState.currentStep === 2) return 2000; if(multiStepState.totalSteps === 3 && multiStepState.currentStep === 3) return multiStepState.remainingAmount; if(multiStepState.totalSteps === 2 && multiStepState.currentStep === 2) return multiStepState.remainingAmount; return 2000; } else if(selectedPackage) return selectedPackage.price; return 0; }
  function renderProgressCard() { if(!multiStepState) return ''; const percent = (multiStepState.currentStep / multiStepState.totalSteps) * 100; return `<div class="progress-card"><div class="progress-steps">${Array.from({ length: multiStepState.totalSteps }, (_, i) => { const stepNum = i + 1; let status = ''; if(stepNum < multiStepState.currentStep) status = 'completed'; else if(stepNum === multiStepState.currentStep) status = 'active'; return `<div class="step ${status}"><div class="step-number">${stepNum}</div><span>Step ${stepNum}</span></div>`; }).join('')}</div><div class="progress-bar-container"><div class="progress-bar-fill" style="width: ${percent}%;"></div></div><div style="margin-top: 0.8rem; font-size: 0.8rem; color: #aaa;">Payment Progress: Step ${multiStepState.currentStep} of ${multiStepState.totalSteps}</div></div>`; }
  function renderQRPayment() { const currentAmount = getCurrentPaymentAmount(); if(currentAmount === 0) { currentView = 'packages'; render(); return '<div></div>'; } setTimeout(()=>{ const c=document.getElementById('qrCanvas'); if(c) genQR(c, currentAmount); },50); const pkg = multiStepState ? multiStepState : selectedPackage; const displayNetwork = pkg?.network || ''; const nc = (displayNetwork === 'VISA') ? { icon: '<i class="fab fa-cc-visa"></i>', color: '#00e5ff', bg: 'rgba(0,229,255,0.15)' } : (displayNetwork === 'Mastercard') ? { icon: '<i class="fab fa-cc-mastercard"></i>', color: '#bf4aff', bg: 'rgba(191,74,255,0.15)' } : { icon: '<i class="fas fa-rupee-sign"></i>', color: '#ffaa33', bg: 'rgba(255,170,51,0.15)' }; const isMultiStep = !!multiStepState; return `<div class="qr-container"><button class="btn-outline" id="backToPackagesFromQR"><i class="fas fa-arrow-left"></i> Back to Vault</button>${isMultiStep ? renderProgressCard() : ''}<h2 style="margin:1rem 0">Secure QR Payment</h2><div class="qr-canvas-wrapper"><canvas id="qrCanvas" class="qr-canvas"></canvas></div><div class="payment-info-card"><div class="payment-info-row"><span class="payment-label"><i class="fas fa-credit-card"></i> SELECTED CARD</span><span class="payment-value"><span class="network-badge-sm" style="background: ${nc.bg}; border:1px solid ${nc.color}; color:${nc.color};">${nc.icon} ${displayNetwork}</span></span></div><div class="payment-info-row"><span class="payment-label">Amount to Pay</span><span class="payment-value" style="color:#0ff; font-size:1.1rem;">₹${currentAmount.toLocaleString()}</span></div></div><div class="upi-id-copy"><span class="upi-id-text"><i class="fas fa-qrcode"></i> UPI: ${UPI_ID}</span><button id="copyUpiBtn" class="btn-copy" style="padding:0.3rem 0.8rem;"><i class="fas fa-copy"></i> Copy UPI ID</button></div><div class="qr-info-card"><div class="qr-info-title"><i class="fas fa-qrcode"></i> Scan QR & Complete Payment</div><div class="qr-info-desc">Use any UPI application to scan the QR code and complete your payment securely.</div><div class="qr-info-features"><div class="qr-info-feature"><i class="fas fa-check-circle"></i> Works with all UPI apps</div><div class="qr-info-feature"><i class="fas fa-shield-alt"></i> Secure QR Payment</div><div class="qr-info-feature"><i class="fas fa-bolt"></i> Instant Confirmation</div><div class="qr-info-feature"><i class="fas fa-headset"></i> 24/7 Support</div></div></div><div class="trust-section"><div class="trust-header"><i class="fas fa-shield-alt"></i><span>🔒 Secure Payment Gateway</span></div><div class="trust-badge"><i class="fas fa-lock"></i> 256-bit Secure Connection</div><div class="trust-features"><div class="trust-feature"><i class="fas fa-bolt"></i> Fast Processing</div><div class="trust-feature"><i class="fas fa-shield-alt"></i> Secure Transaction</div><div class="trust-feature"><i class="fas fa-check-circle"></i> Instant Confirmation</div></div></div><div style="display: flex; gap: 1rem; margin-top: 15px;"><button id="completePaymentBtn" class="btn-primary" style="flex:1;"><i class="fas fa-check-double"></i> I've Completed Payment</button><button id="cancelPaymentBtn" class="btn-cancel" style="flex:1;"><i class="fas fa-times-circle"></i> Cancel Payment</button></div></div>`; }
  function showCancelModal() { const modal = document.createElement('div'); modal.className = 'modal-overlay'; modal.innerHTML = `<div class="modal-card"><i class="fas fa-exclamation-triangle" style="font-size:2.5rem;color:#ff2d55;margin-bottom:1rem;"></i><h3 style="margin-bottom:0.5rem;">Cancel Transaction?</h3><p style="color:#aaa;margin-bottom:1rem;">Are you sure you want to cancel this transaction?</p><div class="modal-buttons"><button id="modalContinueBtn" class="btn-primary" style="padding:0.6rem 1.2rem;">Continue Payment</button><button id="modalCancelBtn" class="btn-cancel" style="padding:0.6rem 1.2rem;margin:0;">Cancel Order</button></div></div>`; document.body.appendChild(modal); setTimeout(() => modal.classList.add('active'), 10); modal.querySelector('#modalContinueBtn').onclick = () => { modal.remove(); }; modal.querySelector('#modalCancelBtn').onclick = () => { modal.remove(); currentView = 'packages'; multiStepState = null; selectedPackage = null; render(); }; modal.onclick = (e) => { if(e.target === modal) modal.remove(); }; }
  function renderUTRPage() { let packageInfo = multiStepState ? multiStepState : selectedPackage; if(!packageInfo) { currentView='packages'; render(); return '<div></div>'; } return `<div class="utr-container"><button class="btn-outline" id="backToQRFromUTR"><i class="fas fa-arrow-left"></i> Back</button><h2>Verify Transaction</h2><p>Amount: <strong style="color:#0ff;">₹${multiStepState ? (multiStepState.currentStep === 1 ? 2000 : (multiStepState.totalSteps === 2 ? 750 : (multiStepState.currentStep === 2 ? 2000 : 1000))) : selectedPackage.price}</strong></p><div style="margin:1.5rem 0"><label>UTR / Transaction ID</label><input type="text" id="utrInput" class="input-field" placeholder="12-digit UTR" maxlength="12" inputmode="numeric"><div id="utrError" class="error-msg"></div></div><button id="submitUtrBtn" class="btn-primary" style="width:100%">Verify Payment</button></div>`; }
  function handleUTRSubmit() { const utrVal = document.getElementById('utrInput')?.value.trim().replace(/\D/g,''); const err = document.getElementById('utrError'); if(!utrVal || utrVal.length !== 12) { err.innerText = 'UTR must be 12 digits'; return false; } return true; }
  function renderFailedPage() { return `<div class="failed-container failed-fade-in"><div class="failed-icon"><i class="fas fa-times-circle"></i></div><h2 style="color:#ff2d55">Payment Failed</h2><p>Unable to verify transaction. Please try again.</p><div style="display:flex; gap:1rem; justify-content:center; margin-top:1.5rem"><button class="btn-outline" id="cancelFailedBtn"><i class="fas fa-times"></i> Cancel</button><button class="btn-primary" id="contactTelegramFailedBtn"><i class="fab fa-telegram"></i> Contact Support</button></div></div>`; }
  function renderSuccessPage() { let displayNetwork, displayPrice; if(multiStepState) { displayNetwork = multiStepState.network; displayPrice = multiStepState.originalPrice; } else { displayNetwork = selectedPackage.network; displayPrice = selectedPackage.price; } return `<div class="success-container"><div class="success-icon"><i class="fas fa-check-circle"></i></div><h2 style="color:#0ff">Vault Access Granted!</h2><p>Your order has been verified</p><div style="background:rgba(0,229,255,0.1); border-radius:1.2rem; padding:1rem; margin:1rem 0"><div><strong>Package</strong><br> ${displayNetwork}</div><div><strong>Amount</strong><br> ₹${displayPrice}</div></div><div style="display:flex; gap:1rem; justify-content:center"><button class="btn-outline" id="contactSupportSuccessBtn">Support</button><button class="btn-primary" id="orderAnotherSuccessBtn">New Order</button></div></div>`; }
  function attachMainEvents() { document.querySelectorAll('.nav-home').forEach(e=>e.addEventListener('click',()=>{ currentView='home'; multiStepState=null; selectedPackage=null; render(); })); document.querySelectorAll('.nav-packages').forEach(e=>e.addEventListener('click',()=>{ currentView='packages'; multiStepState=null; selectedPackage=null; render(); })); document.querySelectorAll('.explore-packages-btn').forEach(e=>e.addEventListener('click',()=>{ currentView='packages'; render(); })); if(currentView==='packages'){ document.querySelectorAll('.tab-btn').forEach(t=>t.addEventListener('click',()=>{ activeNetwork=t.getAttribute('data-network'); render(); })); document.querySelectorAll('.buy-now-btn').forEach(btn=>btn.addEventListener('click',(e)=>{ let p=parseInt(btn.dataset.price), n=btn.dataset.network, ex=btn.dataset.expiry; showLoading(()=>{ handleHighValuePayment(p, n, ex); }); })); } if(currentView==='qr_payment'){ let b=document.getElementById('backToPackagesFromQR'); if(b) b.addEventListener('click',()=>{ currentView='packages'; multiStepState=null; selectedPackage=null; render(); }); let cb=document.getElementById('completePaymentBtn'); if(cb) cb.addEventListener('click',()=>{ if(multiStepState) { if(multiStepState.currentStep === multiStepState.totalSteps) { currentView = 'utr'; render(); } else { multiStepState.currentStep++; if(multiStepState.totalSteps === 2 && multiStepState.currentStep === 2) { multiStepState.remainingAmount = multiStepState.originalPrice - 2000; multiStepState.paidSoFar = 2000; } else if(multiStepState.totalSteps === 3 && multiStepState.currentStep === 2) { multiStepState.remainingAmount = multiStepState.originalPrice - 4000; multiStepState.paidSoFar = 4000; } else if(multiStepState.totalSteps === 3 && multiStepState.currentStep === 3) { multiStepState.remainingAmount = multiStepState.originalPrice - 4000; } currentView = 'qr_payment'; render(); } } else { currentView = 'utr'; render(); } }); let cancelBtn = document.getElementById('cancelPaymentBtn'); if(cancelBtn) cancelBtn.addEventListener('click', () => showCancelModal()); let copyBtn = document.getElementById('copyUpiBtn'); if(copyBtn) copyBtn.addEventListener('click', (e) => { e.preventDefault(); copyUPIID(UPI_ID); }); } if(currentView==='utr'){ let bk=document.getElementById('backToQRFromUTR'); if(bk) bk.addEventListener('click',()=>{ if(multiStepState && multiStepState.currentStep > 1) multiStepState.currentStep--; currentView='qr_payment'; render(); }); let sb=document.getElementById('submitUtrBtn'); if(sb) sb.addEventListener('click',()=>{ if(handleUTRSubmit()) { if(multiStepState && multiStepState.currentStep === multiStepState.totalSteps) { currentView = 'success'; multiStepState = null; selectedPackage = null; render(); } else { currentView = 'failed'; render(); } } }); } if(currentView==='failed'){ let can=document.getElementById('cancelFailedBtn'); if(can) can.addEventListener('click',()=>{ currentView='packages'; multiStepState=null; selectedPackage=null; render(); }); let ct=document.getElementById('contactTelegramFailedBtn'); if(ct) ct.addEventListener('click',()=>window.open('https://t.me/WHITEXOFFICIAL7','_blank')); } if(currentView==='success'){ let oa=document.getElementById('orderAnotherSuccessBtn'); if(oa) oa.addEventListener('click',()=>{ currentView='packages'; multiStepState=null; selectedPackage=null; render(); }); let cs=document.getElementById('contactSupportSuccessBtn'); if(cs) cs.addEventListener('click',()=>window.open('https://t.me/WHITEXOFFICIAL7','_blank')); } let lg=document.getElementById('logoutMainBtn'); if(lg) lg.addEventListener('click',()=>{ isLoggedIn=false; showWelcome=false; mainAppVisible=false; multiStepState=null; selectedPackage=null; render(); }); let tg=()=>window.open('https://t.me/WHITEXOFFICIAL7','_blank'); let tn=document.getElementById('telegramNavBtn'); if(tn) tn.addEventListener('click',tg); let tc=document.getElementById('telegramSupportCard'); if(tc) tc.addEventListener('click',tg); let tgc=document.getElementById('telegramGroupCard'); if(tgc) tgc.addEventListener('click',tg); let ec=document.getElementById('emailSupportCard'); if(ec) ec.addEventListener('click',()=>window.location.href='mailto:vault@whitex.com'); }
  render();
</script>
